const rfLatest=(col,v)=>{const lv=up(v);for(let i=DB.purchases.length-1;i>=0;i--)if(up(DB.purchases[i][col])===lv)return DB.purchases[i];return null};

function rfBatchFill(F){const bt=up(F.batch);for(let i=DB.purchases.length-1;i>=0;i--){const p=DB.purchases[i];if(up(p.id)===up(F.pid)&&up(p.bt)===bt){F.exp=p.ex;F.loc=p.lo;if(F.unit==='')F.unit=fmt(p.up);return true}}return false}
function rfCalc(F){F.total=isNum(F.qty)&&isNum(F.unit)&&F.qty!==''&&F.unit!==''?String(n2(Number(F.qty)*Number(F.unit))):''}
function rfInfo(){const F=RF,e=$('#rfinfo');if(!e)return;e.textContent=F.pid&&F.batch!==''?'Current stock of batch '+F.batch+': '+batchStock(F.pid,F.batch)+(isNum(F.qty)&&F.qty!==''?'  →  after return: '+n2(batchStock(F.pid,F.batch)+(F.row!==''&&DB.returns[F.row-6]&&up(DB.returns[F.row-6].id)===up(F.pid)&&up(DB.returns[F.row-6].bt)===up(F.batch)?0:Number(F.qty))):''):''}

function rfView(){const F=RF;if(!isNum(F.row)||F.row===''){alert('Please enter a valid row number to view a record.');return}const r=Math.floor(Number(F.row));if(r<=5){alert('Invalid Row. Please enter a row number greater than 5.');return}if(r>DB.returns.length+5){alert('Record not found.\nRow '+r+' is empty. The last record is on row '+(DB.returns.length+5)+'.');return}
 const p=DB.returns[r-6];Object.assign(F,{date:p.d,product:p.pn,pid:p.id,generic:p.gn,company:p.co,form:p.df,batch:p.bt,exp:p.ex,loc:p.lo,qty:fmt(p.q),unit:fmt(p.up),total:fmt(p.tp),reason:p.rs||''});rfSync();toast('Displaying record from row '+r+'.')}
function rfSave(){const F=RF;if(!isoRe.test(F.date)){alert('Invalid Return Date.');return}if(!F.pid||!F.product){alert('Please select a Product (name or ID).');return}if(!isNum(F.qty)||F.qty===''||Number(F.qty)<=0){alert('Please enter a valid return quantity.');return}
 if(!DB.purchases.some(p=>up(p.id)===up(F.pid)&&up(p.bt)===up(F.batch))){alert('Batch "'+F.batch+'" does not exist for '+F.pid+'. A return must be added to an existing batch – select the batch from the list.');return}
 rfBatchFill(F);const rec={d:F.date,id:F.pid,co:F.company,pn:F.product,gn:F.generic,df:F.form,bt:F.batch,ex:F.exp,lo:F.loc,up:n2(F.unit),q:n2(F.qty),tp:F.total===''?n2(Number(F.qty)*Number(F.unit||0)):n2(F.total),rs:F.reason,u:USER.name};
 if(F.row===''||Number(F.row)===0)DB.returns.push(rec);else{const r=Number(F.row);if(r<6)return;if(r-6>=DB.returns.length){alert('Record not found.');return}if(!confirm('Overwrite row '+r+'?'))return;DB.returns[r-6]=rec}
 bump();const st=batchStock(rec.id,rec.bt);Object.assign(F,newRF());rfSync();toast('Return saved. Batch '+rec.bt+' of '+rec.pn+' now has stock '+st+'.',4000)}
function pageReturn(){RF=RF||newRF();
 $('#view').innerHTML=`<div class="card" id="rf" style="max-width:720px"><h3>Product Return</h3><p class="mut" style="margin-top:0">A return is added back to the stock of the selected existing batch (Stock = Purchases + Returns − Sales).</p><div class="frm"><label>User Name</label><div><b>${esc(USER.name)}</b></div><label>Last empty row</label><div id="rf_last">${DB.returns.length+6}</div>

 const after=k=>{const F=RF;if(k==='product'){const p=rfLatest('pn',F.product);if(p)rfFromProduct(F,p);else{F.pid='';F.batch=''}}else if(k==='pid'){const p=rfLatest('id',F.pid);if(p)rfFromProduct(F,p)}else if(k==='batch'){if(F.pid&&!rfBatchFill(F)&&F.batch!=='')toast('Batch not found for this product',3000)}

 const v=$('#view');
 v.onchange=e=>{const i=e.target;if(!i.dataset.k)return;RF[i.dataset.k]=i.value;after(i.dataset.k)};
 const choose=async k=>{const F=RF;let items,map=null;if(k==='product')items=uniq(DB.purchases.map(p=>p.pn));else if(k==='pid')items=uniq(DB.purchases.map(p=>p.id));

  const r=await pick('Select One Item',items,null);if(r===null)return;F[k]=map?map.get(r)||'':r;after(k)};
 v.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pk)choose(b.dataset.pk);else if(b.dataset.act==='save')rfSave();else if(b.dataset.act==='view')rfView();else if(b.dataset.act==='clear'){RF=newRF();rfSync();toast('Form has been cleared and is ready for the next entry.')}};

async function readOriginal(buf){const z=await unzipBuf(buf),dec=new TextDecoder(),dp=new DOMParser(),get=n=>z[n]?dp.parseFromString(dec.decode(z[n]),'text/xml'):null;
 const wb=get('xl/workbook.xml'),rels=get('xl/_rels/workbook.xml.rels');if(!wb||!rels)throw new Error('This is not an Excel workbook.');
 const tgt={};for(const r of rels.getElementsByTagName('Relationship'))tgt[r.getAttribute('Id')]=r.getAttribute('Target');
 const sheets={};for(const s of wb.getElementsByTagName('sheet'))sheets[s.getAttribute('name')]='xl/'+String(tgt[s.getAttribute('r:id')]).replace(/^\/?(xl\/)?/,'');
 const ss=[],sd=get('xl/sharedStrings.xml');if(sd)for(const si of sd.getElementsByTagName('si')){let t='';for(const ch of si.childNodes){if(ch.nodeName==='t')t+=ch.textContent;else if(ch.nodeName==='r'){const tt=ch.getElementsByTagName('t')[0];if(tt)t+=tt.textContent}}ss.push(t)}
 const st=get('xl/styles.xml'),nf={};if(st)for(const f of st.getElementsByTagName('numFmt'))nf[f.getAttribute('numFmtId')]=f.getAttribute('formatCode');
 const isDateFmt=id=>{id=+id;if((id>=14&&id<=22)||(id>=27&&id<=36)||(id>=45&&id<=47)||(id>=50&&id<=58))return true;const f=nf[id];return f?/[dy]/i.test(f.replace(/"[^"]*"|\[[^\]]*\]|\\./g,'')):false};
 const dateXf=[];if(st){const cx=st.getElementsByTagName('cellXfs')[0];if(cx)for(const x of cx.getElementsByTagName('xf'))dateXf.push(isDateFmt(x.getAttribute('numFmtId')))}
 const readSheet=name=>{const p=sheets[name],rows=new Map();if(!p||!z[p])return rows;const doc=dp.parseFromString(dec.decode(z[p]),'text/xml');
  for(const r of doc.getElementsByTagName('row')){const rn=+r.getAttribute('r'),arr=[];for(const c of r.getElementsByTagName('c')){const m=/^([A-Z]+)/.exec(c.getAttribute('r'));let ci=0;for(const ch of m[1])ci=ci*26+ch.charCodeAt(0)-64;ci--;const t=c.getAttribute('t'),s=+c.getAttribute('s')||0,ve=c.getElementsByTagName('v')[0],v=ve?ve.textContent:'';let val='';
    if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else if(t==='s')val=ss[+v]??'';else if(t==='str')val=v;else if(t==='b'||t==='e')val='';else if(v!==''){const n=Number(v);val=(dateXf[s]&&n>=1&&n<2958466)?{d:fromSerial(n)}:n}arr[ci]=val}rows.set(rn,arr)}return rows};
 return{sheets,readSheet}}
const iTx=v=>{if(v==null||v==='')return'';if(typeof v==='object')return(+v.d.slice(8))+'/'+(+v.d.slice(5,7))+'/'+v.d.slice(0,4);if(typeof v==='number')return String(v).replace(/e\+?/,'E+').replace('E+-','E-');return String(v).trim()};
const iNum=v=>{const n=typeof v==='number'?v:Number(v);return isNaN(n)?0:n};
const dmy=s=>{let m=/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/.exec(s),y,d,mo;if(m){d=+m[1];mo=+m[2];y=+m[3]}else if(m=/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2})$/.exec(s)){d=+m[1];mo=+m[2];y=2000+ +m[3]}else return null;const t=new Date(Date.UTC(y,mo-1,d));return t.getUTCDate()===d&&t.getUTCMonth()===mo-1?t.toISOString().slice(0,10):null};
const iDate=v=>{if(v&&typeof v==='object')return v.d;if(typeof v==='string')return dmy(v.trim())||'';return''};
const iExp=v=>{if(v==null||v==='')return'';if(typeof v==='object')return v.d;const s=String(v).trim();return dmy(s)||s};
async function parseOriginal(buf){const o=await readOriginal(buf);if(!o.sheets['Purchases(Total)']||!o.sheets['Sales(Total)'])throw new Error('Sheets "Purchases(Total)" and "Sales(Total)" were not found in this file.');
 const P=[],S=[],R=[];for(const[rn,r]of o.readSheet('Purchases(Total)')){if(rn<6||!(iTx(r[2])||r[1]))continue;P.push({d:iDate(r[1]),id:iTx(r[2]),co:iTx(r[3]),pn:iTx(r[4]),gn:iTx(r[5]),df:iTx(r[6]),bt:iTx(r[7]),ex:iExp(r[8]),lo:iTx(r[9]),bx:iNum(r[10]),up:iNum(r[11]),q:iNum(r[12]),tp:Number(r[13])||0,u:iTx(r[14])})}
 for(const[rn,r]of o.readSheet('Sales(Total)')){if(rn<6||!(iTx(r[3])||r[1]))continue;S.push({d:iDate(r[1]),inv:iTx(r[2]),id:iTx(r[3]),pn:iTx(r[4]),bt:iTx(r[5]),q:iNum(r[6]),pr:iNum(r[7]),u:iTx(r[9])})}
 const res={P,S,R,users:[],lists:null,cats:null};
 if(o.sheets['User']){for(const[rn,r]of o.readSheet('User')){if(rn<2)continue;const n=iTx(r[1]);if(n)res.users.push({name:n,pw:iTx(r[2]),chg:/^yes$/i.test(iTx(r[3]))})}}
 if(o.sheets['Purchases_Entry']){const rows=o.readSheet('Purchases_Entry'),col=i=>{const s=new Set();for(const[rn,r]of rows)if(rn>=6&&r[i]!=null&&iTx(r[i]))s.add(iTx(r[i]));return[...s]};res.lists={locs:col(14),forms:col(16),companies:col(17)}}
 if(o.sheets['Sales_Entry']){const rows=o.readSheet('Sales_Entry'),rg=(a,b)=>{const s=[];for(const[rn,r]of rows)if(rn>=a&&rn<=b&&r[8]!=null&&iTx(r[8]))s.push(iTx(r[8]));return s};res.cats={cat1:rg(10,26),cat2:rg(28,44)}}
 return res}
async function parseAnyFile(buf){const u=new Uint8Array(buf);if(isOle(u)){const d=await importXlsx(buf);return{P:d.purchases,S:d.sales,R:d.returns,users:[],lists:null,cats:null,backup:true}}
 const z=await unzipBuf(buf),wbx=z['xl/workbook.xml']?new TextDecoder().decode(z['xl/workbook.xml']):'';if(!wbx)throw new Error('This is not an Excel workbook (.xlsm / .xlsx).');
 if(/name="Purchases_Entry"/.test(wbx))return parseOriginal(buf);if(/name="Returns\(Total\)"/.test(wbx)){const d=await importXlsx(buf);return{P:d.purchases,S:d.sales,R:d.returns,users:[],lists:null,cats:null,backup:true}}

 if(opt.lists&&res.cats){if(res.cats.cat1.length)DB.settings.cat1=res.cats.cat1;if(res.cats.cat2.length)DB.settings.cat2=res.cats.cat2}

const rcNew=()=>{const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(16));let s='';b.forEach((v,i)=>{s+=al[v%32];if(i%4===3&&i<15)s+='-'});return s};

 $('#cn',m).onclick=()=>{closeModal();res(false)};$('#ok',m).onclick=()=>{const a=$('#p1',m).value,b=$('#p2',m).value;if(!a){alert('Password cannot be empty.');return}if(a!==b){alert('The passwords do not match. Please try again.');$('#p1',m).value=$('#p2',m).value='';return}u.pw=hashPw(u.name,a);u.chg=false;if(u.name==='Admin')DB.xl=makeXl(a,u.pw);bump();closeModal();alert('Password changed successfully. You will now be logged in.');res(a)}})}
